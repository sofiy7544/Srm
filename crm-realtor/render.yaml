services:
  # ─── NestJS API ─────────────────────────────────────────────────────────────
  - type: web
    name: crm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: API_PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: REDIS_URL
        # Необязательно — BullMQ gracefully деградирует без Redis
        # Для полного функционала: добавь Upstash Redis URL вручную
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEFAULT_LOCALE
        value: ru
      - key: TRUST_PROXY
        value: "true"
      # MinIO / S3 — добавь вручную если нужна загрузка файлов
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: MINIO_BUCKET
        value: crm-uploads
      # Email — добавь Resend API key вручную
      - key: RESEND_API_KEY
        sync: false

  # ─── Next.js Web ─────────────────────────────────────────────────────────────
  - type: web
    name: crm-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    # NEXT_PUBLIC_* vars must be baked in at BUILD time via build args
    # After deploying the API, copy its URL here and redeploy the web service
    buildArgs:
      - key: NEXT_PUBLIC_API_URL
        value: https://crm-api.onrender.com   # <-- REPLACE with real API URL after first API deploy
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: ru
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: crm-postgres
    databaseName: crm
    user: crm
    plan: free

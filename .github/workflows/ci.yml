name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg2://crm:crm@localhost:5432/crm
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-which-is-long-enough-123456
      VERIFY_TOKEN: ci-verify-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Compile check
        run: python -m compileall app scripts tests

      - name: Run tests
        run: pytest -q

      - name: Smoke import app
        run: python -c "import app.main; print('app imported OK')"

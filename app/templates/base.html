<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}{% block title %}{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#252a35; --text:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --hot:#ff5d5d; --ok:#3ecf8e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    .layout { display:flex; min-height:100vh; }
    .sidebar { width:220px; background:var(--panel); border-right:1px solid var(--line); padding:18px 0; }
    .brand { font-weight:700; padding:0 20px 16px; font-size:15px; border-bottom:1px solid var(--line); }
    .brand small { display:block; color:var(--muted); font-weight:400; font-size:11px; margin-top:4px; }
    .nav a { display:block; padding:11px 20px; color:var(--muted); font-size:14px; }
    .nav a.active, .nav a:hover { color:var(--text); background:#1e222b; border-left:3px solid var(--accent); }
    .main { flex:1; padding:24px 30px; }
    h1 { font-size:20px; margin:0 0 18px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .card .n { font-size:26px; font-weight:700; }
    .card .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.04em; }
    tr:last-child td { border-bottom:none; }
    .badge { padding:2px 8px; border-radius:999px; font-size:11px; background:#222838; color:var(--muted); }
    .badge.hot { background:rgba(255,93,93,.15); color:var(--hot); }
    .score { font-weight:700; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .btn { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; }
    .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
    input, select, textarea { background:#10131a; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 10px; font-size:13px; }
    form.inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .muted { color:var(--muted); }
    .pill { font-size:11px; padding:2px 8px; border-radius:6px; background:#222838; color:var(--muted); }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🥤 Stanley CRM <small>warm audience · Meta</small></div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if active=='dashboard' }}">Dashboard</a>
        <a href="/leads" class="{{ 'active' if active=='leads' }}">Leads</a>
        <a href="/audiences" class="{{ 'active' if active=='audiences' }}">Audiences</a>
        <a href="/campaigns" class="{{ 'active' if active=='campaigns' }}">Campaigns</a>
        <a href="/settings" class="{{ 'active' if active=='settings' }}">Settings</a>
        <a href="/logs" class="{{ 'active' if active=='logs' }}">Logs</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <div></div>
        <div class="muted">👤 {{ user }} · <a href="/logout">logout</a></div>
      </div>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

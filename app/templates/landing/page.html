<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ cfg.title }}</title>
  <style>
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0f1115; color:#e6e9ef; }
    .hero { max-width:560px; margin:0 auto; padding:50px 22px; }
    h1 { font-size:30px; margin:0 0 10px; }
    p.sub { color:#8b93a7; font-size:16px; }
    .product { background:#171a21; border:1px solid #252a35; border-radius:14px; padding:22px; margin:24px 0; }
    .price { font-size:24px; font-weight:700; }
    label { display:block; font-size:12px; color:#8b93a7; margin:12px 0 4px; }
    input { width:100%; background:#10131a; border:1px solid #252a35; color:#e6e9ef; border-radius:8px; padding:11px; font-size:14px; }
    .row { display:flex; gap:10px; }
    .row > div { flex:1; }
    button { background:#4f8cff; color:#fff; border:none; padding:13px; border-radius:9px; font-size:15px; cursor:pointer; width:100%; margin-top:16px; }
    .btn2 { background:#222838; margin-top:10px; }
    .consent { display:flex; gap:8px; align-items:flex-start; margin-top:14px; font-size:12px; color:#8b93a7; }
    a { color:#4f8cff; }
  </style>

  <!-- Meta Pixel base code (official) -->
  <script>
  {% if meta_pixel_id %}
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '{{ meta_pixel_id }}');
    fbq('track', 'PageView');
  {% endif %}
  </script>
</head>
<body>
  <div class="hero">
    <h1>{{ cfg.title }}</h1>
    <p class="sub">Leave a request — our manager will contact you with the price and details.</p>

    <div class="product">
      <div class="price" id="price">$45.00</div>
      <p class="sub">{{ cfg.content }} — premium quality, fast delivery.</p>
      <button class="btn2" type="button" onclick="viewPrice()">See price details</button>
      <button class="btn2" type="button" onclick="addToCart()">Add to cart 🛒</button>
    </div>

    <form method="post" action="/landing/{{ segment }}/lead" onsubmit="return onLead()">
      <div class="row">
        <div><label>Name</label><input name="name" required /></div>
        <div><label>City</label><input name="city" /></div>
      </div>
      <label>Phone</label><input name="phone" required />
      <div class="row">
        <div><label>Email</label><input name="email" type="email" /></div>
        <div><label>Telegram</label><input name="telegram" placeholder="@username" /></div>
      </div>
      <div class="consent">
        <input type="checkbox" name="consent" value="true" required style="width:auto;" />
        <span>I agree to be contacted and to the processing of my data for this request (GDPR).</span>
      </div>
      <button type="submit">Send request</button>
      <a href="https://t.me/" target="_blank"><button type="button" class="btn2" onclick="clickTelegram()">Contact via Telegram</button></a>
    </form>
  </div>

  <script src="/static/pixel.js"></script>
  <script>
    const SEG = "{{ segment }}";
    // Fire ViewContent on load for this segment.
    window.addEventListener('load', function(){ trackEvent('ViewContent', SEG, {content_name:"{{ cfg.content }}"}); });
    function viewPrice(){ trackEvent('ViewContent', SEG, {content_name:'price'}); }
    function addToCart(){ trackEvent('AddToCart', SEG, {value:45.00, currency:'USD'}); alert('Added to cart'); }
    function clickTelegram(){ trackEvent('Contact', SEG, {}); }
    function onLead(){ trackEvent('Lead', SEG, {}); return true; }
    // Purchase event is fired server-side via Conversions API when status -> paid.
  </script>
</body>
</html>

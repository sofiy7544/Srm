<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you — {{ cfg.title }}</title>
  <style>
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0f1115; color:#e6e9ef; font-family:-apple-system,Segoe UI,Roboto,sans-serif; text-align:center; }
    .box { max-width:420px; padding:30px; }
    h1 { font-size:26px; }
    p { color:#8b93a7; }
    a { color:#4f8cff; }
  </style>
  <script>
  {% if meta_pixel_id %}
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '{{ meta_pixel_id }}');
    fbq('track', 'PageView');
    fbq('track', 'Lead');
  {% endif %}
  </script>
</head>
<body>
  <div class="box">
    <h1>✅ Thank you!</h1>
    <p>Your request for <b>{{ cfg.title }}</b> has been received. Our manager will contact you shortly.</p>
    <p><a href="/landing/{{ segment }}">← Back</a></p>
  </div>
</body>
</html>

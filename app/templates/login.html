<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ app_name }} · login</title>
  <style>
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0f1115; color:#e6e9ef; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
    .box { background:#171a21; border:1px solid #252a35; border-radius:12px; padding:30px; width:320px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#8b93a7; font-size:13px; margin:0 0 20px; }
    label { display:block; font-size:12px; color:#8b93a7; margin:12px 0 4px; }
    input { width:100%; background:#10131a; border:1px solid #252a35; color:#e6e9ef; border-radius:7px; padding:10px; font-size:14px; }
    button { width:100%; margin-top:18px; background:#4f8cff; color:#fff; border:none; padding:11px; border-radius:8px; font-size:14px; cursor:pointer; }
    .err { color:#ff5d5d; font-size:12px; margin-top:12px; }
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>🥤 Stanley CRM</h1>
    <p>Sign in to the admin panel</p>
    <label>Username</label>
    <input name="username" autofocus required />
    <label>Password</label>
    <input name="password" type="password" required />
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
